name: Update Limusic input

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nixos
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - id: update
        run: nix flake update limusic

      - id: changes
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.changed == 'true'
        run: nix flake check

      - if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-limusic-input
          delete-branch: true
          commit-message: "chore: update limusic flake input"
          title: "chore: update limusic flake input"
          body: |
            Updates the pinned Limusic packaging flake.

            The NixOS flake check passed before opening this PR.
